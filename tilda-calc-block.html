<meta charset="UTF-8">
<style>
  #yc-wrap * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
  #yc-wrap {
    max-width: 560px; margin: 0 auto; padding: 32px 24px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  #yc-wrap h2 {
    font-size: 22px; font-weight: 700; color: #0e375e;
    margin: 0 0 24px; text-align: center;
  }
  .yc-label {
    font-size: 13px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px;
  }
  .yc-group { margin-bottom: 28px; }
  .yc-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .yc-btn {
    padding: 9px 18px; border-radius: 8px;
    border: 2px solid #e5e7eb; background: #fff;
    color: #374151; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .yc-btn:hover { border-color: #0e375e; color: #0e375e; }
  .yc-btn.active { background: #0e375e; border-color: #0e375e; color: #fff; }
  /* Кнопки выбора яхты */
  #yc-yachts { justify-content: center; }
  .yc-yacht-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .yc-yacht-btn { padding: 14px 32px !important; font-size: 16px !important; }
  .yc-yacht-link {
    font-size: 11px; color: #9ca3af !important; text-decoration: none !important;
    letter-spacing: .02em; transition: color .15s;
  }
  .yc-yacht-link:hover { color: #0e375e !important; }
  .yc-slider-row { display: flex; align-items: center; gap: 14px; }
  #yc-hours { flex: 1; accent-color: #0e375e; }
  #yc-hours-val {
    font-size: 26px; font-weight: 800; color: #0e375e;
    min-width: 44px; text-align: center;
  }
  #yc-season-wrap .yc-btn { flex: 1; text-align: center; }
  #yc-no-season {
    font-size: 13px; color: #9ca3af; background: #f9fafb;
    border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 28px; display: none;
  }
  #yc-result-box {
    background: #f0f7ff; border-radius: 12px;
    padding: 20px 22px; margin-bottom: 20px;
  }
  #yc-price-total { font-size: 38px; font-weight: 800; color: #0e375e; }
  #yc-fee-note { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  #yc-breakdown { margin-top: 14px; padding-top: 14px; border-top: 1px solid #dbeafe; }
  .yc-bd-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #4b5563;
    margin-bottom: 4px; font-family: 'Roboto', sans-serif;
  }
  .yc-bd-row.gift    { color: #059669; font-weight: 600; }
  .yc-bd-row.discount { color: #059669; }
  .yc-bd-row.total {
    font-weight: 700; color: #0e375e; font-size: 14px;
    border-top: 1px solid #bfdbfe; padding-top: 6px; margin-top: 4px;
  }
  #yc-hint {
    font-size: 15px; color: #16a34a; font-weight: 500; margin-top: 12px;
    padding: 9px 14px; background: #f0fdf4; border: 1px solid #bbf7d0;
    border-radius: 6px; display: none;
  }
  .yc-cta { display: flex; gap: 12px; flex-wrap: wrap; }
  #yc-book-btn {
    flex: 1; padding: 17px; background: #0e375e; color: #fff !important;
    text-align: center; border-radius: 10px; text-decoration: none !important;
    font-size: 16px; font-weight: 700; transition: background .15s;
  }
  #yc-book-btn:hover { background: #1a4f7a; color: #fff !important; }
  #yc-more-btn {
    padding: 17px 22px; border: 2px solid #0e375e; color: #0e375e !important;
    border-radius: 10px; text-decoration: none !important;
    font-size: 15px; font-weight: 600; white-space: nowrap;
  }
  #yc-more-btn:hover { background: #f0f7ff; color: #0e375e !important; }
  #yc-loading { text-align: center; color: #9ca3af; padding: 20px; }
</style>

<div id="yc-loading">…</div>

<div id="yc-wrap" style="display:none">
  <h2 id="yc-title"></h2>

  <div class="yc-group">
    <div class="yc-label" id="yc-lbl-yacht"></div>
    <div class="yc-btns" id="yc-yachts"></div>
  </div>

  <div class="yc-group" id="yc-season-wrap">
    <div class="yc-label" id="yc-lbl-season"></div>
    <div class="yc-btns">
      <button class="yc-btn" data-season="high" onclick="ycSetSeason('high')" id="yc-btn-high"></button>
      <button class="yc-btn" data-season="low"  onclick="ycSetSeason('low')"  id="yc-btn-low"></button>
    </div>
  </div>

  <div id="yc-no-season"></div>

  <div class="yc-group">
    <div class="yc-label" id="yc-lbl-hours"></div>
    <div class="yc-slider-row">
      <input type="range" id="yc-hours" min="1" max="9" value="1"
             oninput="ycSetHours(+this.value)">
      <div id="yc-hours-val">1</div>
    </div>
  </div>

  <div class="yc-group">
    <div class="yc-label" id="yc-lbl-currency"></div>
    <div class="yc-btns">
      <button class="yc-btn active" data-currency="AZN" onclick="ycSetCurrency('AZN')">₼ AZN</button>
      <button class="yc-btn"        data-currency="USD" onclick="ycSetCurrency('USD')">$ USD</button>
      <button class="yc-btn"        data-currency="RUB" onclick="ycSetCurrency('RUB')">₽ RUB</button>
    </div>
  </div>

  <div id="yc-result-box">
    <div id="yc-price-total"></div>
    <div id="yc-fee-note"></div>
    <div id="yc-breakdown"></div>
    <div id="yc-hint"></div>
  </div>

  <div class="yc-cta">
    <a href="#popup:myform" id="yc-book-btn"></a>
    <a href="#" id="yc-more-btn" target="_blank" rel="noopener"></a>
  </div>
</div>

<script>
(function () {

  // ── Язык ──────────────────────────────────────────────────────────────
  var path = window.location.pathname;
  var lang = path.indexOf('/en/') !== -1 ? 'en'
           : path.indexOf('/az/') !== -1 ? 'az'
           : 'ru';

  // ── Переводы ──────────────────────────────────────────────────────────
  var LANG = {
    ru: {
      title:       'Рассчитать стоимость',
      yacht:       'Выберите яхту',
      season:      'Сезон',
      season_high: '🌞 Высокий (май–сент)',
      season_low:  '🍂 Низкий (окт–апр)',
      hours:       'Количество часов',
      currency:    'Валюта',
      book:        'Забронировать',
      more:        'Подробнее о яхте →',
      loading:     'Загружаем цены…',
      fee_note:    'Включая сервисный сбор {fee}',
      svc_fee:     'Сервисный сбор',
      total:       'Итого',
      discount:    'Скидка за длительность',
      gift:        '🎁 {h}-й час в подарок!',
      hint:        '💡 Скидка начинается от {n} часов',
      no_season:   '🗓 Цена не зависит от сезона',
      rental:      'Аренда {h} ч',
      per_hour:    '{h} ч × {rate}/ч',
      yacht_link:  'подробнее →'
    },
    en: {
      title:       'Calculate price',
      yacht:       'Choose a yacht',
      season:      'Season',
      season_high: '🌞 High season (May–Sep)',
      season_low:  '🍂 Low season (Oct–Apr)',
      hours:       'Number of hours',
      currency:    'Currency',
      book:        'Book now',
      more:        'Yacht details →',
      loading:     'Loading prices…',
      fee_note:    'Including service fee {fee}',
      svc_fee:     'Service fee',
      total:       'Total',
      discount:    'Duration discount',
      gift:        '🎁 Hour {h} is free!',
      hint:        '💡 Discount starts from {n} hours',
      no_season:   '🗓 Price is not season-dependent',
      rental:      'Rental {h} h',
      per_hour:    '{h} h × {rate}/h',
      yacht_link:  'details →'
    },
    az: {
      title:       'Qiyməti hesabla',
      yacht:       'Yaxta seçin',
      season:      'Mövsüm',
      season_high: '🌞 Yüksək mövsüm (may–sen)',
      season_low:  '🍂 Aşağı mövsüm (okt–apr)',
      hours:       'Saat sayı',
      currency:    'Valyuta',
      book:        'Sifariş edin',
      more:        'Yaxta haqqında →',
      loading:     'Qiymətlər yüklənir…',
      fee_note:    'Xidmət haqqı daxil: {fee}',
      svc_fee:     'Xidmət haqqı',
      total:       'Cəmi',
      discount:    'Müddət endirimi',
      gift:        '🎁 {h}-ci saat hədiyyə!',
      hint:        '💡 Endirim {n} saatdan başlayır',
      no_season:   '🗓 Qiymət mövsümdən asılı deyil',
      rental:      'İcarə {h} saat',
      per_hour:    '{h} saat × {rate}/saat',
      yacht_link:  'ətraflı →'
    }
  };

  var T = LANG[lang];

  // Шаблонизатор: tpl('от {n} часов', {n: 5}) → 'от 5 часов'
  function tpl(str, vars) {
    return str.replace(/\{(\w+)\}/g, function (_, k) {
      return vars[k] !== undefined ? vars[k] : '';
    });
  }

  // ── Резервные данные ──────────────────────────────────────────────────
  var YACHTS_FB = [
    {
      id: 'alora', name: 'Alora', emoji: '⛵',
      fee: 50, seasonal: true, discount_start: 5,
      urls: { ru: '/ru/alora', en: '/en/alora', az: '/az/alora' },
      rates: {
        high: {1:250,2:250,3:250,4:250,5:220,6:220,7:200,8:200,9:200},
        low:  {1:200,2:200,3:200,4:200,5:160,6:160,7:140,8:140,9:140}
      }
    },
    {
      id: 'princess', name: 'Princess', emoji: '🚤',
      fee: 100, seasonal: false, discount_start: 3,
      urls: { ru: '/ru/princess', en: '/en/princess', az: '/az/princess' },
      rates: {
        any: {1:600,2:1200,3:1200,4:1600,5:2000,6:2400,7:2800,8:3200,9:3600}
      }
    }
  ];

  var SETTINGS_FB = { season_high_start: '01.05', season_high_end: '30.09' };

  // ── Google Sheets ─────────────────────────────────────────────────────
  // Prices:   gid=0         (id, name, emoji, slug, fee, seasonal, season, h1-h9, discount_start, url_ru, url_en, url_az)
  // Settings: gid=817590634 (key, value) — season_high_start, season_high_end
  var BASE = 'https://docs.google.com/spreadsheets/d/e/' +
    '2PACX-1vTA7YQnSpv1mYdQJPz315cy2bL2apUQcPhY-q8i2GJX2wUYd9jAagSehQ1RfA7CYm6dKKntlmvO1AN_' +
    '/pub?output=csv';
  var PRICES_URL   = BASE + '&gid=0';
  var SETTINGS_URL = BASE + '&gid=817590634';

  // ── Состояние ─────────────────────────────────────────────────────────
  var yachts = [], settings = {}, seasonMap = {};
  var fxRates = { AZN: 1, USD: 0.588, RUB: 55 };
  var curYacht = null, curSeason = 'high', curHours = 1, curCurrency = 'AZN';

  // ── CSV-парсер ────────────────────────────────────────────────────────
  function parseCSV(text) {
    var rows = [];
    var lines = text.trim().split('\n');
    for (var i = 0; i < lines.length; i++) {
      var cols = [], cur = '', inQ = false;
      for (var j = 0; j < lines[i].length; j++) {
        var c = lines[i][j];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      cols.push(cur.trim());
      rows.push(cols);
    }
    return rows;
  }

  // ── Строим яхты из CSV ────────────────────────────────────────────────
  function buildYachts(rows) {
    var headers = rows[0].map(function (h) {
      return h.trim().toLowerCase().replace(/\s+/g, '_');
    });
    var idx = {};
    headers.forEach(function (h, i) { idx[h] = i; });

    var groups = {}, order = [];

    for (var r = 1; r < rows.length; r++) {
      var cols = rows[r];
      if (!cols[idx.id] || !cols[idx.id].trim()) continue;
      var id = cols[idx.id].trim();

      if (!groups[id]) {
        order.push(id);
        groups[id] = {
          id:             id,
          slug:           (cols[idx.slug]           || id).trim(),
          name:           (cols[idx.name]           || id).trim(),
          emoji:          (cols[idx.emoji]           || '').trim(),
          fee:            +(cols[idx.fee]            || 0),
          seasonal:       (cols[idx.seasonal]        || '').trim().toLowerCase() === 'yes',
          discount_start: +(cols[idx.discount_start] || 0),
          urls: {
            ru: (cols[idx.url_ru] || '').trim(),
            en: (cols[idx.url_en] || '').trim(),
            az: (cols[idx.url_az] || '').trim()
          },
          rates: {}
        };
      }

      var season = (cols[idx.season] || 'any').trim().toLowerCase();

      // Собираем эмодзи сезонов из таблицы
      if (season !== 'any' && !seasonMap[season]) {
        var sEmoji = (cols[idx.season_emoji] || '').trim();
        if (sEmoji) seasonMap[season] = { emoji: sEmoji };
      }

      var rObj = {};
      for (var h = 1; h <= 9; h++) {
        var key = 'h' + h;
        if (idx[key] !== undefined && cols[idx[key]] && cols[idx[key]].trim()) {
          var v = +cols[idx[key]].trim();
          if (v > 0) rObj[h] = v;
        }
      }
      groups[id].rates[season] = rObj;
    }

    return order.map(function (id) { return groups[id]; });
  }

  // ── Настройки из CSV ──────────────────────────────────────────────────
  function buildSettings(rows) {
    var s = {};
    for (var r = 1; r < rows.length; r++) {
      var key = (rows[r][0] || '').trim();
      var val = (rows[r][1] || '').trim();
      if (key) s[key] = val;
    }
    return s;
  }

  // ── Автоопределение сезона ────────────────────────────────────────────
  function detectSeason(s) {
    var today = new Date();
    var mo = today.getMonth() + 1, da = today.getDate();
    function parse(str) {
      var p = (str || '01.01').split('.');
      return { d: +p[0], m: +p[1] };
    }
    var hs = parse(s.season_high_start || SETTINGS_FB.season_high_start);
    var he = parse(s.season_high_end   || SETTINGS_FB.season_high_end);
    var after  = mo > hs.m || (mo === hs.m && da >= hs.d);
    var before = mo < he.m || (mo === he.m && da <= he.d);
    return (after && before) ? 'high' : 'low';
  }

  // ── Курсы валют ───────────────────────────────────────────────────────
  function loadRates() {
    return fetch('https://open.er-api.com/v6/latest/AZN')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.result === 'success' && j.rates) {
          fxRates.USD = +j.rates.USD || fxRates.USD;
          fxRates.RUB = +j.rates.RUB || fxRates.RUB;
        }
      })
      .catch(function () {});
  }

  // ── Загрузка данных ───────────────────────────────────────────────────
  function loadData() {
    return Promise.all([
      fetch(PRICES_URL).then(function (r) {
        if (!r.ok) throw new Error('prices');
        return r.text();
      }),
      fetch(SETTINGS_URL).then(function (r) {
        if (!r.ok) throw new Error('settings');
        return r.text();
      })
    ]).then(function (res) {
      var built = buildYachts(parseCSV(res[0]));
      if (!built.length) throw new Error('empty');
      yachts   = built;
      settings = buildSettings(parseCSV(res[1]));
    }).catch(function () {
      yachts   = YACHTS_FB;
      settings = SETTINGS_FB;
    });
  }

  // ── Форматирование суммы ──────────────────────────────────────────────
  function fmt(azn, currency) {
    var val = azn * fxRates[currency];
    var sym = { AZN: '₼', USD: '$', RUB: '₽' }[currency] || currency;
    var num = currency === 'RUB'
      ? Math.round(val).toLocaleString('ru')
      : Math.round(val).toString();
    return sym + num;
  }

  // ── Расчёт цены ───────────────────────────────────────────────────────
  // Универсальная логика для всех яхт: total = h1 + h2 + ... + h{hours} + fee
  // Стоимость каждого часа задаётся в Sheets явно (h1..h9), total — сумма.
  // Если час в подарок — поставь 0 для соответствующего hN в Sheets.
  // Поле seasonal=yes/no влияет только на выбор сезонного rateset (high/low),
  // а не на саму формулу расчёта.
  function calcPrice(yacht, hours, season) {
    var rSet = yacht.seasonal
      ? (yacht.rates[season] || yacht.rates.high || yacht.rates.any || {})
      : (yacht.rates.any     || yacht.rates.high || {});
    var base = rSet[hours] || 0;
    var total = 0;
    for (var i = 1; i <= hours; i++) total += (rSet[i] || 0);
    total += yacht.fee;
    return { base: base, total: total, rSet: rSet };
  }

  // ── Применяем статичные переводы ──────────────────────────────────────
  function applyLabels() {
    document.getElementById('yc-loading').textContent       = T.loading;
    document.getElementById('yc-title').textContent         = T.title;
    document.getElementById('yc-lbl-yacht').textContent     = T.yacht;
    document.getElementById('yc-lbl-season').textContent    = T.season;
    document.getElementById('yc-btn-high').textContent      = T.season_high;
    document.getElementById('yc-btn-low').textContent       = T.season_low;
    document.getElementById('yc-lbl-hours').textContent     = T.hours;
    document.getElementById('yc-lbl-currency').textContent  = T.currency;
    document.getElementById('yc-no-season').textContent     = T.no_season;
    document.getElementById('yc-book-btn').textContent      = T.book;
    document.getElementById('yc-more-btn').textContent      = T.more;
  }

  // ── Отрисовка ─────────────────────────────────────────────────────────
  function render() {
    if (!curYacht) return;
    var y   = curYacht;
    var res = calcPrice(y, curHours, curSeason);
    var base = res.base, total = res.total, rSet = res.rSet;

    // Сезон / плашка
    document.getElementById('yc-season-wrap').style.display = y.seasonal ? '' : 'none';
    document.getElementById('yc-no-season').style.display   = y.seasonal ? 'none' : 'block';

    // Цена
    document.getElementById('yc-price-total').textContent = fmt(total, curCurrency);
    document.getElementById('yc-fee-note').textContent =
      tpl(T.fee_note, { fee: fmt(y.fee, curCurrency) });

    // Расшифровка — единая логика для всех яхт (seasonal и не-seasonal)
    var rows = [];
    var hoursSum = total - y.fee;
    rows.push('<div class="yc-bd-row"><span>' +
      tpl(T.rental, { h: curHours }) +
      '</span><span>' + fmt(hoursSum, curCurrency) + '</span></div>');
    // Скидка относительно базовой ставки h1: если бы все часы стоили h1, сколько вышло бы
    var h1Rate = rSet[1] || base;
    var noDiscountSum = h1Rate * curHours;
    if (hoursSum < noDiscountSum) {
      var saved = noDiscountSum - hoursSum;
      rows.push('<div class="yc-bd-row discount"><span>' + T.discount +
        '</span><span>−' + fmt(saved, curCurrency) + '</span></div>');
    }
    rows.push('<div class="yc-bd-row"><span>' + T.svc_fee +
      '</span><span>' + fmt(y.fee, curCurrency) + '</span></div>');
    rows.push('<div class="yc-bd-row total"><span>' + T.total +
      '</span><span>' + fmt(total, curCurrency) + '</span></div>');
    document.getElementById('yc-breakdown').innerHTML = rows.join('');

    // Хинт
    var hintEl = document.getElementById('yc-hint');
    if (y.discount_start && y.discount_start > 1) {
      hintEl.textContent = tpl(T.hint, { n: y.discount_start });
      hintEl.style.display = 'block';
    } else {
      hintEl.style.display = 'none';
    }

    // Ссылка «Подробнее о яхте»
    // Прячем если выбранная яхта = текущая страница (мы и так на ней)
    var moreBtn = document.getElementById('yc-more-btn');
    var yachtUrl = y.urls[lang] || y.urls.ru || '';
    var pageSlug  = window.location.pathname.replace(/\/$/, '').split('/').pop();
    var yachtSlug = yachtUrl.replace(/\/$/, '').split('/').pop();
    if (yachtUrl && yachtSlug && pageSlug !== yachtSlug) {
      moreBtn.href = yachtUrl;
      moreBtn.style.display = '';
    } else {
      moreBtn.style.display = 'none';
    }

    document.getElementById('yc-hours-val').textContent = curHours;
  }

  // ── Обработчики ───────────────────────────────────────────────────────
  window.ycSetYacht = function (id) {
    curYacht = yachts.filter(function (y) { return y.id === id; })[0] || yachts[0];
    document.querySelectorAll('[data-yacht]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.yacht === id);
    });
    render();
  };

  window.ycSetSeason = function (s) {
    curSeason = s;
    document.querySelectorAll('[data-season]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.season === s);
    });
    render();
  };

  window.ycSetHours = function (h) {
    curHours = h;
    render();
  };

  window.ycSetCurrency = function (c) {
    curCurrency = c;
    document.querySelectorAll('[data-currency]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.currency === c);
    });
    render();
  };

  // ── Инициализация ─────────────────────────────────────────────────────
  applyLabels();

  Promise.all([loadData(), loadRates()]).then(function () {
    curSeason = detectSeason(settings);

    var container = document.getElementById('yc-yachts');
    yachts.forEach(function (y, i) {
      var item = document.createElement('div');
      item.className = 'yc-yacht-item';

      var btn = document.createElement('button');
      btn.className = 'yc-btn yc-yacht-btn' + (i === 0 ? ' active' : '');
      btn.dataset.yacht = y.id;
      btn.textContent = (y.emoji ? y.emoji + ' ' : '') + y.name;
      btn.onclick = function () { ycSetYacht(y.id); };
      item.appendChild(btn);

      var yachtUrl = y.urls[lang] || y.urls.ru || '';
      if (yachtUrl) {
        var link = document.createElement('a');
        link.className = 'yc-yacht-link';
        link.href = yachtUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = T.yacht_link;
        item.appendChild(link);
      }

      container.appendChild(item);
    });

    document.querySelectorAll('[data-season]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.season === curSeason);
    });

    // Эмодзи сезонов из таблицы, текст из переводов (многоязычный)
    ['high', 'low'].forEach(function (s) {
      var info = seasonMap[s];
      var btn = document.getElementById('yc-btn-' + s);
      var emoji = (info && info.emoji) ? info.emoji + ' ' : '';
      var label = T['season_' + s].replace(/^\S+\s/, ''); // текст без встроенного эмодзи
      btn.textContent = emoji + label;
    });

    curYacht = yachts[0];
    document.getElementById('yc-loading').style.display = 'none';
    document.getElementById('yc-wrap').style.display    = '';
    render();

    // Имена полей формы бронирования.
    // YACHT_FIELD — общий для всех языков (служебное, клиент его не видит).
    // hours — переводится, потому что лейбл клиенту видно.
    var YACHT_FIELD = 'Yacht';
    var FORM_FIELDS = {
      ru: { hours: 'Количество часов' },
      en: { hours: 'Hours'             },
      az: { hours: 'Saat sayı'         }
    };

    document.getElementById('yc-book-btn').addEventListener('click', function () {
      // Закрываем текущий открытый попап (например калькулятор) — иначе при первом
      // клике Tilda стакает попапы и форма бронирования рендерится ПОД калькулятором.
      // Триггерим штатный .t-popup__close, чтобы Tilda корректно очистила своё состояние.
      document.querySelectorAll('.t-popup.t-popup_show .t-popup__close').forEach(function (btn) {
        btn.click();
      });

      setTimeout(function () {
        var f = FORM_FIELDS[lang] || FORM_FIELDS.ru;

        // Slug яхты — text input (Yacht). Подставляем slug из выбранной яхты.
        var yachtInp = document.querySelector('input[name="' + YACHT_FIELD + '"]');
        if (yachtInp && curYacht) {
          yachtInp.value = curYacht.slug || curYacht.id;
          yachtInp.dispatchEvent(new Event('input',  { bubbles: true }));
          yachtInp.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // Часы — number input
        var hoursInp = document.querySelector('input[name="' + f.hours + '"]');
        if (hoursInp) {
          hoursInp.value = curHours;
          hoursInp.dispatchEvent(new Event('input',  { bubbles: true }));
          hoursInp.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }, 400);
    });
  });

})();
</script>
